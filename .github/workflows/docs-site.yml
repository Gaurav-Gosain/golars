name: docs-site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v1
      - name: install
        working-directory: docs-site
        run: bun install --frozen-lockfile
      - name: build
        working-directory: docs-site
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
